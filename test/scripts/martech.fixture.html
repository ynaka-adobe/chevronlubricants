<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="template" content="home">
    <title>Consent and analytics fixture</title>
  </head>
  <body>
    <main>
      <div class="section">
        <div class="block-content">
          <div class="hero wide" data-block-name="hero">
            <a href="/products?email=visitor@example.com#private">Learn more</a>
            <a class="download" href="/docs/delo.pdf?token=secret#private">PDS</a>
          </div>
          <div class="hero wide" data-block-name="hero"><button type="button">View details</button></div>
        </div>
      </div>
      <div class="section">
        <div class="cards-product block"><a href="/products">Products</a></div>
      </div>
    </main>
    <script type="module">
      window.requests = [];
      window.targetCalls = [];
      if (new URLSearchParams(location.search).get('target') === '1') {
        const meta = document.createElement('meta');
        meta.name = 'target';
        meta.content = '1';
        document.head.append(meta);
        window.adobe = { target: {
          async getOffers(request) {
            window.targetCalls.push(structuredClone(request));
            return { execute: { pageLoad: {} } };
          },
        } };
      }
      window.testObservers = [];
      window.Image = class {
        set src(value) {
          window.requests.push(value);
          queueMicrotask(() => this.onload?.());
        }
        removeAttribute() {}
      };
      window.IntersectionObserver = class {
        constructor(callback, options) {
          this.callback = callback;
          this.options = options;
          this.nodes = new Set();
          window.testObservers.push(this);
        }
        observe(node) { this.nodes.add(node); }
        unobserve(node) { this.nodes.delete(node); }
        disconnect() { this.nodes.clear(); }
        trigger(node, ratio) {
          if (this.nodes.has(node)) {
            this.callback([{ target: node, isIntersecting: ratio > 0, intersectionRatio: ratio }], this);
          }
        }
      };
      const [integration, consent, instrument, analytics, media, booklet, ak, target, persona] = await Promise.all([
        import('../../scripts/martech/index.js'),
        import('../../scripts/martech/consent.js'),
        import('../../scripts/martech/instrument.js'),
        import('../../scripts/martech/analytics.js'),
        import('../../scripts/martech/media.js'),
        import('../../scripts/martech/booklet.js'),
        import('../../scripts/ak.js'),
        import('../../scripts/target.js'),
        import('../../scripts/persona.js'),
      ]);
      const params = new URLSearchParams(location.search);
      if (params.get('pagePersona')) {
        const meta = document.createElement('meta');
        meta.name = 'persona';
        meta.content = params.get('pagePersona');
        document.head.append(meta);
      }
      window.personaFetchCounts = { map: 0, index: 0 };
      window.testIndexRows = [];
      window.testResourceRows = [];
      const originalFetch = window.fetch;
      window.fetch = async (input, ...options) => {
        const url = new URL(input, location.origin);
        if (url.pathname === '/en-us/home/schedules/persona-map.json') {
          window.personaFetchCounts.map += 1;
          if (params.get('mapMissing')) return new Response('', { status: 503 });
          return new Response(JSON.stringify({ data: [
            { marketingPersona: 'oem', b2bPersona: params.get('mapRole') || persona.PERSONAS[0] },
            { marketingPersona: 'smart', b2bPersona: persona.PERSONAS[0] },
            { marketingPersona: 'fleet-managers', b2bPersona: persona.PERSONAS[1] },
            { marketingPersona: 'efficiency', b2bPersona: persona.PERSONAS[1] },
            { marketingPersona: 'safety', b2bPersona: persona.PERSONAS[2] },
            { marketingPersona: 'default', b2bPersona: 'default' },
            { marketingPersona: 'b2b', b2bPersona: 'default' },
          ] }));
        }
        if (url.pathname === '/query-index.json') {
          window.personaFetchCounts.index += 1;
          if (params.get('indexMissing')) return new Response('', { status: 503 });
          return new Response(JSON.stringify({
            total: window.testIndexRows.length, data: window.testIndexRows,
          }));
        }
        if (url.pathname === '/test-resources.json') {
          return new Response(JSON.stringify({ data: window.testResourceRows }));
        }
        return originalFetch(input, ...options);
      };
      async function renderPersonaSchedule(items = ['default', ...persona.PERSONAS]) {
        ak.setConfig({ locales: { '': {} }, hostnames: [], linkBlocks: [], components: [] });
        const originalFetch = window.fetch;
        window.fetch = async (input, ...options) => {
          const url = new URL(input, location.origin);
          if (url.pathname === '/test-persona-schedule.json') {
            return new Response(JSON.stringify({ data: items.map((item) => typeof item === 'string'
              ? { name: 'Fallback', persona: item,
                  fragment: `${location.origin}/test-persona-fragment/${encodeURIComponent(item)}` }
              : { ...item, fragment: new URL(item.fragment, location.origin).href }) }));
          }
          if (url.pathname.startsWith('/test-persona-fragment/')) {
            const id = decodeURIComponent(url.pathname.split('/').pop());
            if (window.testFragmentFailures?.includes(id)) return new Response('', { status: 503 });
            return new Response(`<main><div><h1>Content for ${id}</h1></div></main>`);
          }
          return originalFetch(input, ...options);
        };
        const section = document.createElement('div');
        section.className = 'section';
        section.innerHTML = '<p><a href="/test-persona-schedule.json">Schedule</a></p>';
        document.querySelector('main').append(section);
        const { default: decorate } = await import('../../blocks/persona/persona.js');
        await decorate(section.querySelector('a'));
      }
      if (new URLSearchParams(location.search).get('earlyPersona') === '1') {
        await renderPersonaSchedule();
      }
      if (params.get('storageBlocked')) {
        Object.defineProperty(window, 'sessionStorage', {
          configurable: true, get() { throw new Error('Storage blocked'); },
        });
      }
      await integration.default();
      async function renderCollection(name, html, variant = '') {
        const block = document.createElement('div');
        block.className = `${name} ${variant}`.trim();
        block.innerHTML = html;
        document.querySelector('main').append(block);
        const { default: decorate } = await import(`/blocks/${name}/${name}.js`);
        await decorate(block);
        return block;
      }
      async function openPersonaPalette(tag = 'aem-sidekick') {
        const { default: init } = await import('../../tools/persona/bridge.js');
        const sk = document.createElement(tag);
        document.body.append(sk);
        init(sk);
        let root = sk.attachShadow({ mode: 'open' });
        if (tag === 'aem-sidekick') {
          for (const name of ['theme-wrapper', 'palette-container']) {
            const host = document.createElement(name);
            root.append(host);
            root = host.attachShadow({ mode: 'open' });
          }
        }
        const palette = document.createElement('iframe');
        palette.src = `/tools/persona/persona.html?referrer=${encodeURIComponent(location.href)}`;
        const loaded = new Promise((resolve) => { palette.onload = resolve; });
        root.append(palette);
        await loaded;
        return { sk, palette };
      }
      window.testAPI = {
        integration, consent, instrument, analytics, media, booklet, ak, target, persona,
        renderPersonaSchedule, renderCollection, openPersonaPalette,
      };
      document.addEventListener('click', (event) => {
        if (event.target.closest('main a')) event.preventDefault();
      });
    </script>
  </body>
</html>
